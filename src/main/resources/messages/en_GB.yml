prefix: "<bold><red>U</red><white>L</white> <dark_gray>» </dark_gray></bold>"
reload: "<dark_green>Plugin reloaded.</dark_green>"
teleport:
  start: "Teleporting in 3 seconds. Move to cancel."
  cancel: "Teleport cancelled."
  no-spawn: "<red>The target has no spawn point set.</red>"
  not-public: "<yellow>The target spawn is not public.</yellow>"

errors:
  no-permission: "<red>You don't have permission to use this command."
  player-not-found: "<red>Could not find player {name}.</red>"
  citizen-not-found: "<red>Could not find citizen {name}.</red>"
  no-citizen-data: "<red>Critical error: No citizen data found for {name}. This should never happen. Please contact an admin.</red>"
  not-in-claim: "<red>You are not in a claimed chunk.</red>"
  not-in-settlement: "<red>You are not part of a settlement.</red>"
  not-in-country: "<red>You are not part of a country.</red>"
  already-in-settlement: "<red>You can't do that, you are already in {settlement}.</red>"
  settlement-not-found: "<red>Couldn't find settlement {settlement}</red>"
  country-not-found: "<red>Couldn't find country {country}</red>"
  no-claim-permission: "<red>You don't have any permissions in this chunk."
  no-settlement-permission: "<red>You don't have the necessary settlement rank do this ({perm})"
  wrong-number-format: "<red>{input} is not a number.</red>"
  no-funds: "<yellow>You don't have enough money to do this, you need at least {amount}.</yellow>"

admin:
  usage:
    settlement:
      create: "/ula settlement create <settlement_name>"
      delete: "/ula settlement delete <settlement_name>"
      claim: "/ula settlement claim <settlement_name>"
      unclaim: "/ula settlement unclaim"
      setspawn: "/ula settlement setspawn <settlement_name>"
      addcitizen: "/ula settlement addcitizen <settlement_name> <player_name>"
      removecitizen: "/ula settlement removecitizen <settlement_name> <player_name>"
    country:
      create:  "/ula country create <country_name> <capital>"
      delete: "/ula country delete <settlement_name>"
      setcolor: "/ula country setcolor <country_name> <#hexcolor>"
      claim: "/ula country claim <country_name>"
      addsettlement: "/ula country addsettlement <country_name> <settlement_name>"
    towny:
      import: "/ula towny import [town_name] (leave out to import all towns)"
  settlement:
    create: "<green>Settlement <bold>{settlement}</bold> has been created."
    delete: 
      is-capital: "<red>This settlement is a country capital."
      success: "<green>Settlement <bold>{settlement}</bold> has been deleted."
    claim: "<green>Chunk {chunk} claimed for settlement {settlement}."
    unclaim: "<green>Unclaimed chunk at {chunk} from settlement {settlement}."
    setspawn: "<green>Successfully set spawn for settlement {settlement}."
    addcitizen:
      already-in-settlement: "<red>The citizen is already in another settlement."
      success: "<green>Added {name} to settlement {settlement}."
    removecitizen:
      not-in-settlement: "<red>The citizen is is not a member of the settlement."
      success: "<green>Removed {name} from settlement {settlement}."
  country:
    create: "<green>Country <bold>{country}</bold> has been created."
    delete: "<green>Country <bold>{country}</bold> has been deleted."
    setcolor: "<green>Color for country <bold>{country}</bold> has been set."
    claim: "<green>Claimed the region of {region} for {country}.</green>"
    addsettlement: 
      settlement-has-country: "<red>The settlement is already part of a country."
      success: "<green>Added settlement {settlement} to country {country}."
    setcapital: 
      settlement-not-in-country: "<red>The settlement is not part of the country."
      success: "<green>Set settlement {settlement} as capital of country {country}."
  towny:
    import:
      error: "<red>Error while importing: {message}"
      success-settlement: "<gray>Successfully imported settlement <blue>{settlement}</blue> ({plots} chunks) from Towny."
      success-country: "<gray>Successfully imported country <green>{country}</green> from Towny."
      
settlement:
  create:
    claimed: "<red>This space is already claimed!</red>"
    player: "<green>Congratulations, you have crated the settlement of <bold>{settlement}</bold>! Find out how to manage your town on our /wiki and don't hesitate to ask other players in the chat.</green>"
    broadcast: "<aqua>{player} has just created the settlement of <blue>{settlement}</blue> (Region: <red>{region}</red> | Country: <green>{country}</green>)"
  delete:
    is-capital: "<red>You cannot delete a country capital. Move the capital or delete the country first.</red>"
    deleted-broadcast: "<aqua>The settlement of {settlement} has ceased to exist!</aqua>"
  rename: "<green>You have renamed your settlement to {name}</green>"
  setboard:
    cleared: "<aqua>Your settlement's board has been cleared."
    set: '<aqua>Your settlement''s board has been updated. Use "/settlement setboard EMPTY" to clear it.</aqua>'
  setspawn:
    not-in-claims: "<red>The spawn location must be inside of settlement claims</red>"
    set: "<aqua>Your settlement's spawn has been updated.</aqua>"
  setcolor:
    wrong-format: "<red>You must supply a hexadecimal color (e.g. #FF0000)</red>"
    set: "<aqua>Successfully changed your settltment color.</aqua>"
  permission:
    unknown-membership: "<red>Unknown group: {membership}"
    unknown-permission: "<red>Unknown permission: {permission}"
    set: "<aqua>Settlement permission {permission} for {membership} set to {state}</aqua>"
  toggle:
    unknown-toggle: "<red>Unknown toggle: {toggle}"
    set: "<aqua>Toggled settlement {field} to {state}</aqua>"
  claim:
    already-claimed: "<red>This chunk is already claimed</red>"
    success: "<aqua>Claimed chunk at {chunk} for {settlement} for {costs}</aqua>"
    has-country: "<red>This chunk belongs to a region owned by {country}, and they do not allow foreign towns to claim.</red>"
    outside-of-region: "<red>Claiming outside of a settlement's home region is not allowed.</red>"
  unclaim:
    has-spawn: "<red>You cannot unclaim this chunk, it contains the settlement spawn. Move the spawn first.</red>"
    is-home-chunk: "<yellow>You cannot unclaim the settlement's home chunk</yellow>"
    not-in-settlement: "<yellow>This chunk does not belong to your settlement</yellow>"
    not-claimed: "<yellow>This chunk is not claimed</yellow>"
    success: "<aqua>Unclaimed chunk at {chunk}</aqua>"
  invite:
    player-joined: "<aqua>{name} has joined the town!</aqua>"
    settlement-joined: "<aqua>You have joined {settlement}! User [<yellow>/s spawn</yellow>] to go there.</aqua>"
  leave:
    is-mayor: "<red>You're the mayor of this settlement, you can't leave.</red>"
    is-leader: "<red>You're the country leader, you can't leave.</red>"
    player-left: "<aqua>{name} has left the town!</aqua>"
    settlement-left: "<aqua>You have left {settlement}.</aqua>"
  ranks:
    unknown-rank: "<red>Unknown rank: {rank}</red>"
    cannot-remove-mayor: "<red>You cannot remove the mayor rank. You can only pass it to another citizen.</red>"
    rank-already-owned: "<yellow>Player {name} already has the rank {rank}</yellow>"
    rank-not-owned: "<yellow>Player {name} doesn't have the rank {rank}</yellow>"
    added: "<aqua>Added settlement rank <bold>{rank}</bold> to player {name}.</aqua>"
    removed: "<aqua>Removed settlement rank <bold>{rank}</bold> from player {name}.</aqua>"
    received: "<aqua>You received the town rank <bold>{rank}</bold>.</aqua>"
    lost: "<aqua>You lost the town rank <bold>{rank}</bold>.</aqua>"
  kick:
    cannot-kick-yourself: "<yellow>You can't kick yourself from the settlement.</yellow>"
    not-in-settlement: "<yellow>The player is not a citizen of this settlement.</yellow>"
    is-leader: "<red>You can't kick the country leader.</red>"
    success: "<aqua>Player {name} has been kicked from the settlement.</aqua>"
    kicked: "<yellow>You have been kicked from {settlement}.</yellow>"
  no-funds: "<yellow>The settlement doesn't have {amount} in its bank.</yellow>"
  deposit: "<aqua>You deposited {amount} into the settlement bank.</aqua>"
  withdraw: "<aqua>You took {amount} from the settlement bank.</aqua>"

settlementchunk:
  toggle:
    unknown-toggle: "<red>Unknown toggle: {toggle}"
    set: "<aqua>Toggled plot {field} to {state}</aqua>"
  permission:
    unknown-membership: "<red>Unknown group: {membership}"
    unknown-permission: "<red>Unknown permission: {permission}"
    set: "<aqua>Plot permission {permission} for {membership} set to {state}</aqua>"
  sell:
    has-owner: "<yellow>This plot is already owned by {owner}. Evict the current owner before putting this plot up for sale.</yellow>"
    success: "<aqua>This plot is now for sale for {price}. Use [<yellow>/plot forsale clear</yellow>] to cancel the sale.</aqua>"
    cleared: "<aqua>This plot is no longer for sale.</aqua>"
  buy:
    not-for-sale: "<yellow>This plot is not for sale.</yellow>"
    success: "<green>You successfully bought the plot for {price}.</green>"
  evict:
    no-owner: "<yellow>This plot is not owned by anyone.</yellow>"
    success: "<aqua>You evicted the current owner of this plot.</aqua>"
  abandon:
    not-owner: "<yellow>You are not the owner of this plot.</yellow>"
    success: "<aqua>You abandoned this plot.</aqua>"

country:
  create:
    no-region: "<red>Can't create country, the settlement is not in any region.</red>"
    region-occupied: "<red>Can't create country, the region is already under the control of {country}.</red>"
    player: "<green>Congratulations, you have crated the country of {country}}! Find out how to manage it on our /wiki and don't hesitate to ask other players in the chat.</green>"
    broadcast: "<aqua>{player} has just created the country of <blue>{country}</blue> (Region: <red>{region}</red>)"
  delete:
    deleted-broadcast: "<aqua>The country of {country} no longer exists!</aqua>"
  claim:
    success: "<aqua>You claimed the region of {region} for {country}</aqua>"
    broadcast: "<aqua>{player} has just claimed the region of <red>{region}</red> for <blue>{country}</blue>"
    no-region: "<red>There is no region to claim at this location.</red>"
    already-claimed: "<red>This region is already claimed</red>"
  setcolor:
    wrong-format: "<red>You must supply a hexadecimal color (e.g. #FF0000)</red>"
    set: "<aqua>Successfully changed your nation color.</aqua>"
  no-funds: "<yellow>The country doesn't have {amount} in its bank.</yellow>"
  deposit: "<aqua>You deposited {amount} into the country bank.</aqua>"
  withdraw: "<aqua>You took {amount} from the country bank.</aqua>"

approval:
  no-approval-pending: "<yellow>You don't have any pending requests to approve.</yellow>"
  multiple-approvals: "<yellow>There is more than one request of this type pending. Please specify the request you wish to approve.</yellow>"

# Info Screens

info-screens:
  header:
    max-chars: 55
    filler-start: ".oOo."
    filler: "_"
    filler-end: ".oOo."
    filler-color: "gold"
    title-color: "white"
    title-start: ".[ "
    title-end: " ]."
  settlement:
    board: "<gray><bold>Board:</bold> {board}"
    region: "<dark_gray><gray><bold>Region:</bold> {region}</gray> | <gray><bold>Country:</bold> -</gray></dark_gray>"
    founded: "<dark_gray><gray><bold>Founded:</bold> {founded}</gray> | <gray><bold>By:</bold> {founder} </gray></dark_gray>"
    mayor: "<gray><bold>Mayor:</bold> {mayor}"
    toggles: "<gray><bold>Toggles:</bold> <dark_gray>{public} | {pvp} | {mobs} | {animals} | {fire} | {explosions} </dark_gray>"
    perm-1: "<dark_gray><gray><bold>Perms:</bold></gray>  <gray>Break</gray> {break} | <gray>Place</gray> {place} | <gray>Open</gray> {open}<dark_gray>"
    perm-2: "<dark_gray><gray><bold>         </bold></gray><gray>Switch</gray> {switch} | <gray>Use</gray> {use}   | <gray>Interact</gray> {interact}<dark_gray>"
    balance: "<gray><bold>Balance:</bold> {balance}</gray>"
    sizeupkeep: "<dark_gray><gray><bold>Size:</bold> [<aqua>{size}</aqua>]</gray> | <gray><bold>Upkeep:</bold> [<aqua>{upkeep}</aqua>]</gray></dark_gray>"
    citizens: "<gray><bold>Citizens:</bold> [<aqua>{citizens-count}</aqua>]</gray>"
  settlementchunk:
    owner: "<dark_gray><gray><bold>Owner:</bold> {owner}</gray> | <gray><bold>Claimed:</bold> {claimed}</gray></dark_gray>"
    sale: "<dark_gray><gray><bold>For sale:</bold> {forsale}</gray> | <gray><bold>Price:</bold> {price}</gray></dark_gray>"
    toggles: "<gray><bold>Toggles:</bold> <dark_gray>{public} | {pvp} | {mobs} | {animals} | {fire} | {explosions} </dark_gray>"
    perm-1: "<dark_gray><gray><bold>Perms:</bold></gray>  <gray>Break</gray> {break} | <gray>Place</gray> {place} | <gray>Open</gray> {open}<dark_gray>"
    perm-2: "<dark_gray><gray><bold>         </bold></gray><gray>Switch</gray> {switch} | <gray>Use</gray> {use}   | <gray>Interact</gray> {interact}<dark_gray>"
  country:
    board: "<gray><bold>Board:</bold> {board}"
    founded: "<dark_gray><gray><bold>Founded:</bold> {founded}</gray> | <gray><bold>By:</bold> {founder} </gray></dark_gray>"
    leader: "<gray><bold>Leader:</bold> {mayor}"
    capital: "<gray><bold>Capital:</bold> {capital}"
    citizens: "<dark_gray>[<yellow>Citizens: {citizens-count}</yellow>]</dark_gray>"
    sizeupkeep: "<dark_gray><gray><bold>Size:</bold> [<aqua>{size}</aqua>]</gray> | <gray><bold>Upkeep:</bold> [<aqua>{upkeep}</aqua>]</gray></dark_gray>"
    balance: "<gray><bold>Balance:</bold> {balance}</gray>"
