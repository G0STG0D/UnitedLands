# Note:
# These permission aren't actual server permissions nodes (setting them e.g. in LuckPerms doesn't make a difference)
# These are human-readable identifiers used in rank permission checks.

settlement:
  mayor:
    - settlement.claim
    - settlement.unclaim
    - settlement.manage.perms
    - settlement.manage.toggle
    - settlement.manage.ranks.mayor
    - settlement.manage.ranks.other
    - settlement.rename
    - settlement.delete
    - settlement.setboard
    - settlement.setspawn
    - settlement.setcolor
    - settlement.invite
    - settlement.kick
    - settlement.plot.sell
    - settlement.plot.evict
    - settlement.withdraw
    - settlement.joincountry
    - settlement.usetaxpercent
    - settlement.settaxes
  co-mayor:
    - settlement.claim
    - settlement.manage.perms
    - settlement.manage.toggle
    - settlement.manage.ranks.other
    - settlement.setboard
    - settlement.invite
    - settlement.plot.sell
    - settlement.plot.evict
    - settlement.withdraw
  treasurer:
    - foo.bar
  landlord:
    - foo.bar
  banker:
    - foo.bar
  noble:
    - foo.bar
  militia:
    - foo.bar
  soldier:
    - foo.bar
  officer:
    - foo.bar

country:
  leader:
    - country.delete
    - country.withdraw
    - country.releasesettlement
    - country.manage.ranks.leader
    - country.manage.ranks.other
    - region.claim
    - region.unclaim
    - region.manage.toggle
    - region.manage.perms
  assistant:
    - foo.bar
  general:
    - foo.bar
  diplomat:
    - foo.bar
  treasurer:
    - foo.bar
